name: BI feed

# Feeds BI Agent (Agent #2): Power BI / Fabric news, patterns and TMDL samples
# -> data/bi_latest.csv + data/bi_health.csv. Runs every 6 hours, off the hour.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_bi.py"
      - "tests/test_fetch_bi.py"
      - ".github/workflows/bi_feed.yml"
      - "data/bi_keywords.csv"

permissions:
  contents: write

concurrency:
  group: bi-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_fetch_bi.py"

      - name: Fetch BI feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_bi.py

      # The price workflow also pushes to main, so rebase and retry on a race.
      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bi_latest.csv data/bi_health.csv data/bi_trends.csv
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: update BI feed $(TZ=Asia/Ho_Chi_Minh date -Iseconds)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
