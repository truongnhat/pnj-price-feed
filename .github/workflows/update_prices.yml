name: Update prices

on:
  schedule:
    # Hourly at minute 17 (UTC). Off the top of the hour to avoid GitHub's
    # scheduler congestion; scheduled runs can still be delayed by a few minutes.
    - cron: "17 * * * *"
  workflow_dispatch:

# Only this workflow's own commits need write access.
permissions:
  contents: write

# Never run two updates at once (prevents push races on data/).
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      # Runs even when the fetch step fails (every source down), so health.csv
      # still records the failures. If the tests failed, no files changed.
      - name: Commit and push if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv data/latest.csv data/health.csv
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          git commit -m "data: update prices $(TZ=Asia/Ho_Chi_Minh date -Iseconds)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push failed (attempt $attempt), rebasing on remote and retrying..."
            git pull --rebase
            sleep $((attempt * 5))
          done
          echo "::error::Could not push price update after 3 attempts"
          exit 1
