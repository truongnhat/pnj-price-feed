name: Update prices

on:
  schedule:
    # Hourly at minute 17 (UTC). Off the top of the hour to avoid GitHub's
    # scheduler congestion; scheduled runs can still be delayed by a few minutes.
    - cron: "17 * * * *"
    # Backup slot half an hour later: GitHub silently drops many scheduled runs
    # under load, so a second slot keeps the feed fresh when the first is lost.
    # When both fire, the concurrency group below runs them one after the other.
    # An external trigger (apps_script/trigger.gs) can also call
    # workflow_dispatch, which GitHub does not drop.
    - cron: "47 * * * *"
  workflow_dispatch:
  # Run right after a code change is merged, so a fix shows up in data/ at once
  # instead of at the next hourly run. The bot's own data commits use
  # GITHUB_TOKEN, which never triggers workflows, and data/ is not a watched
  # path, so this cannot loop.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update_prices.yml"

# Only this workflow's own commits need write access.
permissions:
  contents: write

# Never run two updates at once (prevents push races on data/).
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: python -m unittest discover -s tests

      - name: Fetch prices
        id: fetch
        run: python scripts/fetch_prices.py

      # Runs even when the fetch step fails (every source down), so health.csv
      # still records the failures. Every fetch run stamps last_checked in
      # health.csv, so there is always a commit, even when no price changed.
      # If the tests failed, no files changed.
      - name: Commit and push if changed
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.csv data/latest.csv data/health.csv
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          # New history rows = lines added minus lines changed in place (last_checked).
          git diff --cached --numstat data/prices.csv \
            | awk '{print "new_rows=" ($1 - $2)}' >> "$GITHUB_OUTPUT"
          git commit -m "data: update prices $(TZ=Asia/Ho_Chi_Minh date -Iseconds)"
          for attempt in 1 2 3; do
            if git push; then echo "committed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push failed (attempt $attempt), rebasing on remote and retrying..."
            git pull --rebase
            sleep $((attempt * 5))
          done
          echo "::error::Could not push price update after 3 attempts"
          exit 1

      # Emails a short report after every run, whatever the outcome. Needs the
      # MAIL_USERNAME / MAIL_PASSWORD (and optionally MAIL_TO) secrets; without
      # them it only prints the report. Repository variable EMAIL_NOTIFY
      # = always (default) | failure | off.
      - name: Email run report
        if: ${{ always() }}
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_NOTIFY: ${{ vars.EMAIL_NOTIFY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          TESTS: ${{ steps.tests.outcome }}
          FETCH: ${{ steps.fetch.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          NEW_ROWS: ${{ steps.commit.outputs.new_rows }}
        # python3 is the runner's own Python, so this works even if setup-python failed.
        run: python3 scripts/notify_email.py
